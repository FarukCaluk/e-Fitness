services:
  mysql:
    image: mysql:8.0
    container_name: efitness-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: efitness
      MYSQL_USER: efitness_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-efitness_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - efitness-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  efitness-mysql-data:
