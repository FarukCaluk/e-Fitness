<section class="dashboard">
  <h1 class="page-title">My Clients</h1>
  <p class="page-sub">Members assigned to you for training.</p>

  <div class="card">
    <div class="search-bar">
      <mat-form-field appearance="outline" style="flex: 1; min-width: 220px;">
        <mat-label>Search clients</mat-label>
        <input matInput [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()" />
      </mat-form-field>
    </div>

    <table mat-table [dataSource]="clients" class="mat-elevation-z0">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let client">{{ client.fullName }}</td>
      </ng-container>

      <ng-container matColumnDef="contact">
        <th mat-header-cell *matHeaderCellDef>Contact</th>
        <td mat-cell *matCellDef="let client">{{ client.email }}</td>
      </ng-container>

      <ng-container matColumnDef="plan">
        <th mat-header-cell *matHeaderCellDef>Plan</th>
        <td mat-cell *matCellDef="let client">{{ client.currentPlanName || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="joined">
        <th mat-header-cell *matHeaderCellDef>Joined</th>
        <td mat-cell *matCellDef="let client">{{ client.joinDate | date: 'mediumDate' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let client">
          <button mat-button color="primary" (click)="scheduleSession(client)">Schedule</button>
          <button mat-button (click)="buildWorkout(client)">Workout</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <p *ngIf="!isLoading && clients.length === 0" class="page-sub">No clients assigned yet.</p>

    <mat-paginator
      [length]="totalCount"
      [pageSize]="pageSize"
      [pageSizeOptions]="[10, 20, 50]"
      [pageIndex]="pageNumber - 1"
      (page)="onPageChange($event)"
    ></mat-paginator>
  </div>
</section>
