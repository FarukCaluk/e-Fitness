<h2 mat-dialog-title>Edit Member</h2>

<mat-dialog-content>
  <mat-progress-spinner *ngIf="isLoading" mode="indeterminate" diameter="28"></mat-progress-spinner>

  <form *ngIf="!isLoading" [formGroup]="form" class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Phone number</mat-label>
      <input matInput formControlName="phoneNumber" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Date of birth</mat-label>
      <input matInput [matDatepicker]="dobPicker" formControlName="dateOfBirth" />
      <mat-datepicker-toggle matIconSuffix [for]="dobPicker"></mat-datepicker-toggle>
      <mat-datepicker #dobPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Gender</mat-label>
      <input matInput formControlName="gender" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>City</mat-label>
      <input matInput formControlName="city" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Address</mat-label>
      <input matInput formControlName="address" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Emergency contact name</mat-label>
      <input matInput formControlName="emergencyContactName" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Emergency contact phone</mat-label>
      <input matInput formControlName="emergencyContactPhone" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Assigned trainer</mat-label>
      <mat-select formControlName="assignedTrainerId">
        <mat-option [value]="null">None</mat-option>
        <mat-option *ngFor="let trainer of trainers" [value]="trainer.id">{{ trainer.fullName }}</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="isLoading || isSaving" (click)="save()">Save</button>
</mat-dialog-actions>
